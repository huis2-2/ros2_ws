# BEV calibration file.
# This is an empty template.  Run bev_calibrate.py, click A, B, C, D, check
# the BEV Preview, then press "s" to overwrite this file with real values.
# Code that loads this file refuses to use it while calibrated is false.
format_version: 1
calibrated: false
calibration_date: null
coordinate_frame:
  origin: rear axle centre on the floor
  x: vehicle right (+)
  y: vehicle forward (+)
  unit: m
image_size: {width: 640, height: 480}
reference: {}
points: []
homography_image_to_ground: null
homography_image_to_bev: null
bev:
  pixels_per_meter: 1000.0
  pixels_per_cm: 10.0
  x_range_m: [-0.4, 0.4]
  y_range_m: [-0.05, 0.9]
  output_size: {width: 800, height: 950}
  origin_pixel: {u: 400.0, v: 900.0}
undistortion: {enabled: false}
